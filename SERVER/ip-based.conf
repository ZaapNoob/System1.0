define IP_ROOT "C:/laragon/www/System1.0"
define IP_ADDR "192.168.1.200"

# HTTP → HTTPS Redirect
<VirtualHost ${IP_ADDR}:80>
    ServerName ${IP_ADDR}
    DocumentRoot "${IP_ROOT}"
    
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

# HTTPS + Reverse Proxy for 192.168.1.200
<VirtualHost ${IP_ADDR}:443>
    ServerName ${IP_ADDR}
    DocumentRoot "${IP_ROOT}"

    # SSL Configuration
    SSLEngine on
    SSLProxyEngine On
    SSLCertificateFile C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile C:/laragon/etc/ssl/laragon.key

    ProxyPreserveHost On

    # ====== ROUTING RULES (in order of specificity) ======

    # 1. WebSocket connections → Ratchet server on :8080
    # ProxyPass handles Upgrade headers automatically with mod_proxy_wstunnel
    ProxyPass /ws ws://127.0.0.1:8080/ connectiontimeout=3600 timeout=3600
    ProxyPassReverse /ws ws://127.0.0.1:8080/

    # 2. API endpoints → Served directly by PHP (DO NOT proxy)
    ProxyPass /api !
    
    
    # 3. Frontend everything else → Vite dev server on :5173
    ProxyPass / http://127.0.0.1:5173/ nocanon
    ProxyPassReverse / http://127.0.0.1:5173/

    <Directory "${IP_ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>